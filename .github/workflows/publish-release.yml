name: Publish OpenHarmony Go release

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
  workflow_dispatch:
    inputs:
      release_tag:
        description: OpenHarmony release tag, for example go1.27.2-ohos.1
        required: true
        type: string
      source_commit:
        description: Commit on master to publish; defaults to the selected ref
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}-${{ github.event.pull_request.head.ref || format('release/{0}', inputs.release_tag) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       startsWith(github.event.pull_request.head.ref, 'release/go') &&
       (github.event.action != 'closed' || github.event.pull_request.merged == true))
    runs-on: ubuntu-24.04
    outputs:
      upstream_tag: ${{ steps.metadata.outputs.upstream_tag }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      revision: ${{ steps.metadata.outputs.revision }}
      source_commit: ${{ steps.metadata.outputs.source_commit }}
      test_commit: ${{ steps.metadata.outputs.test_commit }}
      source_date_epoch: ${{ steps.metadata.outputs.source_date_epoch }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - name: Check out merged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merge_commit_sha || inputs.source_commit || github.sha }}

      - name: Validate branch-derived release metadata
        id: metadata
        shell: bash
        env:
          EVENT_ACTION: ${{ github.event.action }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PR_MERGE_COMMIT: ${{ github.event.pull_request.merge_commit_sha }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            if [[ ! "$PR_HEAD_REF" =~ ^release/(go[0-9]+\.[0-9]+\.[0-9]+-ohos\.[1-9][0-9]*)$ ]]; then
              echo "Release PR branch has an invalid name: $PR_HEAD_REF" >&2
              exit 1
            fi
            release_tag="${BASH_REMATCH[1]}"
            if [[ "$EVENT_ACTION" == closed ]]; then
              if [[ "$PR_MERGED" != true || -z "$PR_MERGE_COMMIT" ]]; then
                echo 'A closed release PR must be merged before publication.' >&2
                exit 1
              fi
              source_commit="$PR_MERGE_COMMIT"
              publish=true
              read -r -a commit_line <<<"$(git rev-list --parents -n 1 "$source_commit")"
              if (( ${#commit_line[@]} < 3 )); then
                echo 'The release PR was not integrated with a merge commit.' >&2
                echo 'Squash and rebase merges cannot preserve the upstream tag ancestry.' >&2
                exit 1
              fi
            else
              source_commit="$GITHUB_SHA"
              publish=false
            fi
          else
            release_tag="$DISPATCH_RELEASE_TAG"
            source_commit="${DISPATCH_SOURCE_COMMIT:-$GITHUB_SHA}"
            publish=true
          fi

          if [[ ! "$release_tag" =~ ^(go[0-9]+\.[0-9]+\.[0-9]+)-ohos\.([1-9][0-9]*)$ ]]; then
            echo "Invalid OpenHarmony release tag: $release_tag" >&2
            exit 1
          fi
          upstream_tag="${BASH_REMATCH[1]}"
          revision="${BASH_REMATCH[2]}"
          prerelease=false

          if ! git cat-file -e "${source_commit}^{commit}" 2>/dev/null; then
            echo "Source commit is unavailable: $source_commit" >&2
            exit 1
          fi

          version="$(git show "$source_commit:VERSION" | sed -n '1p')"
          if [[ "$version" != "$upstream_tag" ]]; then
            echo "VERSION contains $version, expected $upstream_tag." >&2
            exit 1
          fi

          git fetch --no-tags https://github.com/golang/go.git "refs/tags/$upstream_tag"
          upstream_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if ! git merge-base --is-ancestor "$upstream_commit" "$source_commit"; then
            echo "$upstream_tag ($upstream_commit) is not an ancestor of $source_commit." >&2
            exit 1
          fi

          if [[ "$publish" == true ]]; then
            git fetch --no-tags origin \
              "+refs/heads/master:refs/remotes/origin/master"
            if ! git merge-base --is-ancestor "$source_commit" refs/remotes/origin/master; then
              echo "$source_commit is not contained in origin/master." >&2
              exit 1
            fi
          fi

          source_date_epoch="$(git show -s --format=%ct "$source_commit")"
          test_commit="$source_commit"
          {
            echo "upstream_tag=$upstream_tag"
            echo "release_tag=$release_tag"
            echo "prerelease=$prerelease"
            echo "revision=$revision"
            echo "source_commit=$source_commit"
            echo "test_commit=$test_commit"
            echo "source_date_epoch=$source_date_epoch"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"

          {
            echo "### Branch-derived release metadata"
            echo
            echo "- Upstream tag: \`$upstream_tag\`"
            echo "- OpenHarmony tag: \`$release_tag\`"
            echo "- Source commit: \`$source_commit\`"
            echo "- Publish after validation: \`$publish\`"
          } >>"$GITHUB_STEP_SUMMARY"

  test:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out merged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.test_commit }}

      - name: Install bootstrap Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          check-latest: true
          cache: false

      - name: Run toolchain tests
        shell: bash
        run: bash build/release/test.sh

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out merged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.test_commit }}

      - name: Install bootstrap Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.25.x
          check-latest: true
          cache: false

      - name: Build release archive
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
        run: |
          bash build/ohos_release/build.sh \
            "${{ needs.prepare.outputs.release_tag }}" \
            "$RUNNER_TEMP/release-assets"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

  openharmony-cgo-build:
    name: OpenHarmony cgo test bundle
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out merged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.test_commit }}

      - name: Download amd64 release archive
        uses: actions/download-artifact@v8
        with:
          name: release-amd64
          path: ${{ runner.temp }}/release-amd64

      - name: Extract amd64 release toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/release-amd64/*.tar.gz)
          checksums=("$RUNNER_TEMP"/release-amd64/*.sha256)
          if (( ${#archives[@]} != 1 || ${#checksums[@]} != 1 )); then
            echo "Expected one amd64 archive and checksum." >&2
            exit 1
          fi
          (
            cd "$RUNNER_TEMP/release-amd64"
            sha256sum -c "$(basename "${checksums[0]}")"
          )
          extract_dir="$RUNNER_TEMP/go-amd64"
          mkdir -p "$extract_dir"
          tar -xzf "${archives[0]}" -C "$extract_dir"
          goroot="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          [[ -n "$goroot" && -x "$goroot/bin/go" ]]
          echo "goroot=$goroot" >> "$GITHUB_OUTPUT"

      - name: Set up OpenHarmony 7.0 SDK
        uses: openharmony-rs/setup-ohos-sdk@bd7155a335273ce736c57cb51f7172935b8b5a94
        with:
          version: '7.0'
          components: native
          cache: true
          mirror: true

      - name: Validate OpenHarmony SDK compiler
        shell: bash
        run: |
          set -euo pipefail
          test -x "$OHOS_SDK_NATIVE/llvm/bin/clang"
          test -d "$OHOS_SDK_NATIVE/sysroot"
          "$OHOS_SDK_NATIVE/llvm/bin/clang" \
            --target=aarch64-linux-ohos \
            --sysroot="$OHOS_SDK_NATIVE/sysroot" \
            -print-effective-triple

      - name: Build OpenHarmony cgo smoke bundle
        shell: bash
        env:
          GOROOT_UNDER_TEST: ${{ steps.toolchain.outputs.goroot }}
        run: |
          bash build/openharmony/build-cgo.sh \
            --goroot "$GOROOT_UNDER_TEST" \
            --sdk "$OHOS_SDK_NATIVE" \
            --output "$RUNNER_TEMP/openharmony-cgo-assets"

      - name: Upload OpenHarmony cgo smoke bundle
        uses: actions/upload-artifact@v7
        with:
          name: openharmony-cgo-smoke
          path: ${{ runner.temp }}/openharmony-cgo-assets/*
          if-no-files-found: error
          retention-days: 7

  openharmony-runtime:
    name: OpenHarmony runtime (DockerHarmony arm64)
    needs:
      - prepare
      - build
      - openharmony-cgo-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Check out merged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.test_commit }}

      - name: Download arm64 release archive
        uses: actions/download-artifact@v8
        with:
          name: release-arm64
          path: ${{ runner.temp }}/release-arm64

      - name: Download OpenHarmony cgo smoke bundle
        uses: actions/download-artifact@v8
        with:
          name: openharmony-cgo-smoke
          path: ${{ runner.temp }}/openharmony-cgo-assets

      - name: Extract arm64 release toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=("$RUNNER_TEMP"/release-arm64/*.tar.gz)
          checksums=("$RUNNER_TEMP"/release-arm64/*.sha256)
          if (( ${#archives[@]} != 1 || ${#checksums[@]} != 1 )); then
            echo "Expected one arm64 archive and checksum." >&2
            exit 1
          fi
          (
            cd "$RUNNER_TEMP/release-arm64"
            sha256sum -c "$(basename "${checksums[0]}")"
          )
          extract_dir="$RUNNER_TEMP/go-arm64"
          mkdir -p "$extract_dir"
          tar -xzf "${archives[0]}" -C "$extract_dir"
          goroot="$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          [[ -n "$goroot" && -x "$goroot/bin/go" ]]
          echo "goroot=$goroot" >> "$GITHUB_OUTPUT"

      - name: Run OpenHarmony userland tests
        shell: bash
        env:
          OPENHARMONY_DOCKER_TIMEOUT_SECONDS: '300'
        run: |
          cgo_binary="$RUNNER_TEMP/openharmony-cgo-assets/openharmony-cgo-smoke"
          test -f "$cgo_binary"
          # Artifact downloads do not reliably preserve executable bits.
          chmod +x "$cgo_binary"
          test -x "$cgo_binary"
          bash build/openharmony/test-runtime.sh \
            --repo "$GITHUB_WORKSPACE" \
            --goroot "${{ steps.toolchain.outputs.goroot }}" \
            --cgo-binary "$cgo_binary" \
            --go-test-packages sync

  publish:
    if: needs.prepare.outputs.publish == 'true'
    needs:
      - prepare
      - test
      - build
      - openharmony-runtime
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out merged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release archives
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          checksums=(dist/*.sha256)
          if (( ${#checksums[@]} != 2 )); then
            echo "Expected two checksum files, found ${#checksums[@]}." >&2
            exit 1
          fi
          for checksum in "${checksums[@]}"; do
            (
              cd dist
              sha256sum -c "$(basename "$checksum")"
            )
          done

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          OHOS_REVISION: ${{ needs.prepare.outputs.revision }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
        run: |
          set -euo pipefail

          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG" 2>/dev/null || true
          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" >/dev/null; then
            tagged_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            if [[ "$tagged_commit" != "$SOURCE_COMMIT" ]]; then
              echo "$RELEASE_TAG already points to $tagged_commit, not $SOURCE_COMMIT." >&2
              exit 1
            fi
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$RELEASE_TAG" "$SOURCE_COMMIT" \
              -m "OpenHarmony Go release $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists."
            exit 0
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          cat >"$notes_file" <<EOF
          OpenHarmony Go toolchain based on upstream $UPSTREAM_TAG.

          - Upstream source: https://github.com/golang/go/tree/$UPSTREAM_TAG
          - OpenHarmony source commit: https://github.com/$GITHUB_REPOSITORY/commit/$SOURCE_COMMIT
          - OpenHarmony revision: ohos.$OHOS_REVISION
          - Validation: short standard-library tests, targeted toolchain tests,
            OpenHarmony compile/runtime checks, and amd64/arm64 release builds

          This release was published automatically after its release PR was
          manually merged into the master branch.
          EOF

          shopt -s nullglob
          assets=(dist/*)
          release_args=(
            release create "$RELEASE_TAG"
            "${assets[@]}"
            --repo "$GITHUB_REPOSITORY"
            --title "Go ${UPSTREAM_TAG#go} for OpenHarmony (ohos.$OHOS_REVISION)"
            --notes-file "$notes_file"
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          else
            release_args+=(--latest)
          fi
          gh "${release_args[@]}"
